<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breadcrumb</title>
<meta name="description" content="Breadcrumb — see what your business can borrow, from the trail your payments already left. Clickable prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Design tokens — taken from the Fintech UI Kit
   Primary #2C48FF · tint ramp #445DFF → #E5E8FF
   Duotone icon fills #CCD3FF / #99A7FF · pill buttons · 18px cards · Inter
   ========================================================= */
:root{
  --primary:#2C48FF; --primary-press:#2139E0;
  --p1:#445DFF; --p2:#5970FF; --p3:#798BFF; --p4:#99A7FF; --p5:#CCD3FF; --p6:#E5E8FF; --p7:#F3F5FF;
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#0E1030; --ink2:#363A58; --muted:#6F7490; --faint:#A3A7BD; --hair:#E8EAF2;
  --green:#14996A; --green-soft:#E2F5EE; --amber:#C9860C; --amber-soft:#FBF1DD; --red:#CF4A3E; --red-soft:#FBE7E4;
  --navy:#0A0D2B; --navy2:#12163F; --navy3:#1C2156; --lens-ink:#E8EAFF; --lens-muted:#8C92C2; --lens-hair:rgba(204,211,255,.12);
  --r-card:18px; --r-lg:24px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(14,16,48,.04), 0 2px 8px rgba(14,16,48,.04);
  --shadow-2:0 2px 6px rgba(14,16,48,.05), 0 12px 32px rgba(14,16,48,.08);
  --ease:cubic-bezier(.2,.8,.2,1);
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
b,strong{font-weight:600}

/* ---------- stage (desktop: phone + lens) ---------- */
.stage{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px;
  background:radial-gradient(1200px 700px at 30% 20%, #FFFFFF 0%, var(--bg) 55%, #ECEEF7 100%)}
.phone{position:relative;width:390px;height:min(844px, calc(100dvh - 48px));border-radius:48px;background:var(--navy);padding:10px;
  box-shadow:0 0 0 1px rgba(10,13,43,.9), 0 30px 80px rgba(14,16,48,.22), 0 8px 24px rgba(14,16,48,.12);flex:none}
.phone::before{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:20px;background:var(--navy);z-index:30}
.app{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{position:relative;flex:none;height:56px;margin-top:40px;padding:0 16px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .2s}
.iconbtn:hover{background:var(--p7)}
.iconbtn[disabled]{opacity:0;pointer-events:none}
.wordmark{justify-self:center;display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.wordmark .crumbs{display:flex;gap:3px;align-items:center}
.wordmark .crumbs i{display:block;width:5px;height:5px;border-radius:50%;background:var(--primary)}
.wordmark .crumbs i:nth-child(2){opacity:.55}.wordmark .crumbs i:nth-child(3){opacity:.25}
.lens-pill{display:none;position:absolute;right:16px;top:12px;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--navy);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;align-items:center;gap:6px}
.lens-pill .dot{width:6px;height:6px;border-radius:50%;background:#5BE3A8}

/* ---------- trail progress ---------- */
.progress{flex:none;padding:4px 28px 10px;transition:opacity .25s}
.progress.hide{opacity:0;height:0;padding:0;overflow:hidden}
.prog-row{position:relative;display:flex;justify-content:space-between;align-items:center;height:14px}
.prog-line{position:absolute;left:6px;right:6px;top:50%;height:2px;transform:translateY(-50%);
  background-image:radial-gradient(circle, var(--p5) 1px, transparent 1.3px);background-size:7px 2px;background-repeat:repeat-x}
.prog-fill{position:absolute;left:6px;top:50%;height:2px;transform:translateY(-50%);transition:width .5s var(--ease);
  background-image:radial-gradient(circle, var(--primary) 1px, transparent 1.3px);background-size:7px 2px;background-repeat:repeat-x}
.prog-dot{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--p5);transition:all .3s var(--ease)}
.prog-dot.done{background:var(--primary);border-color:var(--primary)}
.prog-dot.now{border-color:var(--primary);box-shadow:0 0 0 4px var(--p6)}
.prog-labels{display:flex;justify-content:space-between;margin-top:6px}
.prog-labels span{width:12px;display:flex;justify-content:center;font-size:11px;color:var(--faint);font-weight:500;white-space:nowrap}
.prog-labels span.on{color:var(--ink2)}

/* ---------- scrolling screen ---------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.screen{padding:12px 24px 24px;min-height:100%;display:flex;flex-direction:column}
.screen.enter{animation:enter .32s var(--ease) both}
.screen.enter-back{animation:enterBack .32s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.foot{margin-top:auto;padding-top:28px;font-size:11px;line-height:1.5;color:var(--faint);text-align:center}

.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:10px}
h1.h{font-size:28px;line-height:1.18;font-weight:700;letter-spacing:-.025em}
h2.h{font-size:24px;line-height:1.22;font-weight:700;letter-spacing:-.022em}
.sub{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.55}
.why{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.5}
.why svg{flex:none;margin-top:2px}
.gap-s{height:12px}.gap{height:20px}.gap-l{height:28px}

/* ---------- CTA ---------- */
.cta-bar{flex:none;padding:12px 24px 24px;background:linear-gradient(to top, var(--bg) 70%, rgba(244,245,250,0));position:relative;z-index:2}
.cta-bar:empty{display:none}
.btn{width:100%;height:58px;border-radius:var(--r-pill);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s, transform .12s, opacity .2s, box-shadow .2s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(44,72,255,.24)}
.btn-primary:hover{background:var(--primary-press)}
.btn-primary[disabled]{background:var(--p5);box-shadow:none;cursor:not-allowed;color:#fff}
.btn-secondary{background:var(--p6);color:var(--primary)}
.btn-secondary:hover{background:var(--p5)}
.btn-ghost{height:48px;color:var(--primary);font-weight:500;font-size:15px}
.btn-sm{height:44px;font-size:14px;width:auto;padding:0 18px}
.link{color:var(--primary);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:44px}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-1);border:1px solid var(--hair)}
.card.pad{padding:18px}
.choice{width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:16px;min-height:72px;border-radius:var(--r-card);background:var(--surface);
  border:1.5px solid var(--hair);box-shadow:var(--shadow-1);transition:border-color .2s, box-shadow .2s, transform .12s, background .2s}
.choice:hover{border-color:var(--p5)}
.choice:active{transform:scale(.99)}
.choice.sel{border-color:var(--primary);box-shadow:0 0 0 4px var(--p6)}
.choice .ttl{font-weight:600;font-size:16px;letter-spacing:-.01em}
.choice .dsc{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.45}
.choice .radio{margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--p5);display:grid;place-items:center;transition:all .2s}
.choice.sel .radio{border-color:var(--primary);background:var(--primary)}
.choice.sel .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.stack{display:flex;flex-direction:column;gap:12px}
.ico{flex:none;width:52px;height:52px;border-radius:16px;background:var(--p7);display:grid;place-items:center}
.ico img{width:34px;height:auto;max-height:34px;object-fit:contain}
.ico svg{width:34px;height:34px}

.persona-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.persona{flex-direction:column;align-items:flex-start;gap:12px;padding:16px;min-height:168px}
.persona .ico{width:56px;height:56px}
.persona .ttl{font-size:15px}
.persona .dsc{font-size:12.5px}
.persona .tick{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--primary);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:all .2s var(--ease)}
.persona{position:relative}
.persona.sel .tick{opacity:1;transform:none}

.opt{width:100%;min-height:58px;padding:0 20px;border-radius:var(--r-card);background:var(--surface);border:1.5px solid var(--hair);text-align:left;font-weight:500;font-size:16px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-1);transition:all .2s var(--ease)}
.opt:hover{border-color:var(--p5)}
.opt.sel{border-color:var(--primary);background:var(--p7);color:var(--primary)}
.opt .chev{color:var(--faint)}
.opt.sel .chev{color:var(--primary)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:var(--r-pill);background:var(--surface);border:1.5px solid var(--hair);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
.chip:hover{border-color:var(--p5)}
.chip.sel{background:var(--primary);border-color:var(--primary);color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.tag-blue{background:var(--p6);color:var(--primary)}
.tag-green{background:var(--green-soft);color:var(--green)}
.tag-amber{background:var(--amber-soft);color:var(--amber)}
.tag-ink{background:var(--navy);color:#fff}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--ink2)}
.input{height:56px;border-radius:16px;border:1.5px solid var(--hair);background:var(--surface);padding:0 16px;font-size:16px;outline:none;transition:border-color .2s, box-shadow .2s;width:100%}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--p6)}
.input-row{display:flex;gap:8px}
.input-wrap{position:relative;flex:1}
.input-wrap .prefix{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.input-wrap .input{padding-left:52px}
textarea.input{height:96px;padding:14px 16px;resize:none;line-height:1.5}
.otp{letter-spacing:.5em;font-variant-numeric:tabular-nums;text-align:center;font-weight:600}
.verified{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:13px;font-weight:600}

/* ---------- AI card ---------- */
.ai{border-radius:var(--r-card);background:var(--surface);border:1px solid var(--hair);padding:16px;box-shadow:var(--shadow-1)}
.ai-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--primary);margin-bottom:8px;letter-spacing:.02em}
.ai-head .spark{width:22px;height:22px;border-radius:8px;background:var(--p6);display:grid;place-items:center}
.ai-text{font-size:15px;line-height:1.6;color:var(--ink2);min-height:1.6em}
.ai-text.typing::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--primary);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ai-line{margin-top:12px;font-size:14px;color:var(--ink2);display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--p7)}

/* ---------- landing ---------- */
.hero-visual{position:relative;height:236px;margin:4px -4px 8px}
.hero-card{position:absolute;left:50%;top:12px;width:300px;height:189px;transform:translateX(-50%) rotate(-4deg);border-radius:18px;overflow:hidden;box-shadow:0 20px 40px rgba(44,72,255,.28)}
.hero-card.back{transform:translateX(-46%) rotate(5deg) translateY(10px);opacity:.5;filter:saturate(.6);box-shadow:none}
.cardface{position:absolute;inset:0;padding:20px 22px;color:#fff;display:flex;flex-direction:column}
.cardface .lbl{font-size:12px;opacity:.75}
.cardface .amt{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.cardface .row{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.cardface .row .k{font-size:11px;opacity:.7}
.cardface .row .v{font-size:13px;font-weight:600;letter-spacing:.01em}
.cardface .brand{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.cardface .brand .crumbs{display:flex;gap:3px}.cardface .brand .crumbs i{width:5px;height:5px;border-radius:50%;background:#fff;display:block}
.cardface .brand .crumbs i:nth-child(2){opacity:.6}.cardface .brand .crumbs i:nth-child(3){opacity:.3}
.trust-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.trust{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 10px;font-size:12px;line-height:1.35;color:var(--ink2);font-weight:500;display:flex;flex-direction:column;gap:8px}
.trust .ck{width:24px;height:24px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center}

/* ---------- mirror / chart ---------- */
.bignum{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.bignum small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.chart{margin-top:18px;padding:16px 14px 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:3px;display:block}
.insights{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.insight{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--hair);font-size:13px;color:var(--ink2)}
.insight i{width:8px;height:8px;border-radius:50%;flex:none}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;font-size:14px;line-height:1.5}
.notice.amber{background:var(--amber-soft);color:#6D4A07}
.notice.blue{background:var(--p7);color:var(--ink2);border:1px solid var(--p6)}
.notice.green{background:var(--green-soft);color:#0B5A3D}
.notice svg{flex:none;margin-top:2px}

/* ---------- loader ---------- */
.loader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:30px}
.loader .ico{width:84px;height:84px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow-2);margin-bottom:28px}
.loader .ico img{width:46px;max-height:46px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
.trail-svg{width:100%;height:auto;margin:6px 0 24px}
.status{height:24px;font-weight:600;font-size:17px;letter-spacing:-.01em;position:relative;width:100%}
.status span{position:absolute;left:0;right:0;opacity:0;transform:translateY(8px);transition:all .35s var(--ease)}
.status span.on{opacity:1;transform:none}
.mdot{opacity:0;animation:pop .35s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.mdot{transform-box:fill-box;transform-origin:center}

/* ---------- pool ---------- */
.pool-card{position:relative;height:200px;border-radius:18px;overflow:hidden;box-shadow:0 18px 36px rgba(44,72,255,.24)}
.pool-track{position:relative;height:48px;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(135deg, var(--p7) 0 8px, var(--p6) 8px 16px);border:1px solid var(--p6)}
.pool-fill{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:14px 0 0 14px;transition:width .15s linear;display:flex;align-items:center;padding-left:14px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.pool-fill.full{border-radius:14px}
.pool-free{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--primary);white-space:nowrap}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 4px}
.slider-head .q{font-weight:600;font-size:15px}
.slider-head .v{font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--primary)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;--pct:33%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(to right, var(--primary) var(--pct), var(--p6) var(--pct))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--p6)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--primary)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--primary);box-shadow:0 2px 8px rgba(44,72,255,.3);margin-top:-11px}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--primary);box-shadow:0 2px 8px rgba(44,72,255,.3)}
.range-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:-4px}
.stat-rows{margin-top:18px}
.stat{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--hair)}
.stat:first-child{border-top:0;padding-top:4px}
.stat .sw{flex:none;width:12px;height:12px;border-radius:4px;margin-top:5px}
.stat .t{font-size:14px;color:var(--ink2);line-height:1.5}
.stat .t b{color:var(--ink)}
.stat .t .m{display:block;color:var(--muted);font-size:13px}
.fees{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--ink2);line-height:1.5}

/* ---------- route ---------- */
.route{flex-direction:column;align-items:stretch;gap:0;padding:18px}
.route .top{display:flex;align-items:center;gap:12px}
.route .rate{margin-top:14px;display:flex;align-items:baseline;gap:6px}
.route .rate b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.route .rate span{color:var(--muted);font-size:13px}
.route .dsc{margin-top:6px}
.route .sub-act{margin-top:10px;font-size:13px;color:var(--primary);font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:36px}

/* ---------- timeline ---------- */
.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;
  background-image:radial-gradient(circle, var(--p4) 1px, transparent 1.3px);background-size:2px 7px;background-repeat:repeat-y}
.tl{position:relative;padding:0 0 18px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:-27px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.tl:first-child::before{background:var(--primary)}
.tl .w{font-size:12px;font-weight:600;color:var(--primary);letter-spacing:.02em}
.tl .d{font-size:14px;color:var(--ink2);margin-top:2px;line-height:1.5}

/* ---------- summary rows ---------- */
.rows .r{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--hair);font-size:14px}
.rows .r:first-child{border-top:0;padding-top:0}
.rows .r:last-child{padding-bottom:0}
.rows .r span{color:var(--muted)}
.rows .r b{text-align:right}
.success-badge{width:64px;height:64px;border-radius:22px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:18px}

/* ---------- sheets ---------- */
.sheet-layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,13,43,.42);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 24px 28px;
  transform:translateY(100%);transition:transform .32s var(--ease);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet-layer.open{pointer-events:auto}
.sheet-layer.open .scrim{opacity:1}
.sheet-layer.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--hair);margin:0 auto 16px}
.sheet h3{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.sheet .sub{font-size:14px}
.sheet-close{position:absolute;top:14px;right:14px}
.consent-list{margin-top:18px;border-radius:var(--r-card);border:1px solid var(--hair);overflow:hidden}
.consent-item{display:flex;gap:12px;padding:14px 16px;font-size:14px;line-height:1.5;color:var(--ink2);border-top:1px solid var(--hair)}
.consent-item:first-child{border-top:0}
.consent-item .ci{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.consent-item b{color:var(--ink);display:block;font-size:13px;margin-bottom:1px}
.banks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.bank{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;border:1.5px solid var(--hair);background:var(--surface);font-size:12px;font-weight:500;text-align:center;line-height:1.3;transition:all .2s;min-height:96px}
.bank:hover{border-color:var(--p5)}
.bank.sel{border-color:var(--primary);box-shadow:0 0 0 4px var(--p6)}
.bank .mono{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.02em}
.step-steps{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.how{display:flex;gap:14px;align-items:flex-start}
.how .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--p6);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:14px}
.how b{display:block;font-size:15px}
.how span{font-size:14px;color:var(--muted)}
.factor{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--hair);font-size:14px;color:var(--ink2)}
.factor:first-child{border-top:0}
.factor .sg{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;line-height:1}
.lever{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--p7);border:1px solid var(--p6);text-align:left;font-size:14px;margin-top:8px;transition:background .2s}
.lever:hover{background:var(--p6)}
.lever b{color:var(--primary)}
.dropzone{margin-top:18px;border:1.5px dashed var(--p4);border-radius:var(--r-card);background:var(--p7);padding:24px 16px;text-align:center}
.file{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--hair);margin-top:18px}
.file .bar2{height:4px;border-radius:4px;background:var(--p6);margin-top:8px;overflow:hidden}
.file .bar2 i{display:block;height:100%;background:var(--primary);width:0;transition:width 1.1s var(--ease)}
.label-s{font-size:13px;font-weight:600;color:var(--ink2);margin:20px 0 8px}

/* ---------- toast ---------- */
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:60;background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:center;
  box-shadow:0 12px 30px rgba(10,13,43,.3);opacity:0;transform:translateY(10px);transition:all .25s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:none}

/* =========================================================
   Lender Lens — behind-the-scenes panel
   ========================================================= */
.lens{width:440px;height:min(844px, calc(100dvh - 48px));border-radius:28px;background:var(--navy);color:var(--lens-ink);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px rgba(10,13,43,.25);flex:none}
.lens-head{padding:22px 24px 16px;border-bottom:1px solid var(--lens-hair);display:flex;justify-content:space-between;align-items:center}
.lens-head .t{font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center}
.lens-head .live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:#5BE3A8;background:rgba(91,227,168,.1);padding:4px 8px;border-radius:999px}
.lens-head .live i{width:6px;height:6px;border-radius:50%;background:#5BE3A8;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.lens-body{flex:1;overflow-y:auto;padding:18px 24px 24px;scrollbar-width:thin;scrollbar-color:var(--navy3) transparent}
.lens-sec{padding:16px 0;border-top:1px solid var(--lens-hair)}
.lens-sec:first-child{border-top:0;padding-top:0}
.lens-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lens-muted);font-weight:600;margin-bottom:10px}
.lens-v{font-size:14px;line-height:1.5}
.lens-mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.score{display:flex;align-items:center;gap:18px}
.score-ring{position:relative;width:84px;height:84px;flex:none}
.score-ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.score-ring circle{transition:stroke-dashoffset .6s var(--ease), stroke .4s}
.score-ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:24px;font-weight:600}
.score .lab{font-size:18px;font-weight:600}
.score .hint{font-size:12.5px;color:var(--lens-muted);margin-top:2px;line-height:1.45}
.signals{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.sig{display:flex;justify-content:space-between;font-size:12.5px;color:var(--lens-muted)}
.sig.on{color:var(--lens-ink)}
.sig .p{font-family:var(--mono)}
.sig.on .p{color:#5BE3A8}
.conf{display:flex;align-items:center;gap:10px}
.conf .pill{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:8px;background:var(--navy3);color:var(--lens-ink)}
.conf .pill.ok{background:rgba(91,227,168,.12);color:#5BE3A8}
.conf .pill.warn{background:rgba(255,196,94,.12);color:#FFC45E}
.notes{display:flex;flex-direction:column;gap:8px}
.note{display:flex;gap:10px;font-size:13px;line-height:1.5;padding:10px 12px;border-radius:12px;background:var(--navy2)}
.note i{flex:none;width:6px;height:6px;border-radius:50%;margin-top:7px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13px}
.kv span{color:var(--lens-muted)}
.kv b{font-family:var(--mono);font-weight:500;text-align:right;color:var(--lens-ink)}
.kv b.hl{color:#5BE3A8}
.capbar{margin-top:12px;height:8px;border-radius:8px;background:var(--navy3);overflow:hidden}
.capbar i{display:block;height:100%;background:var(--p3);border-radius:8px;transition:width .3s}
.handoff{background:var(--navy2);border:1px solid var(--lens-hair);border-radius:18px;padding:16px}
.handoff .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.handoff .nm{font-weight:600;font-size:16px}
.handoff .sum{margin-top:12px;padding-top:12px;border-top:1px solid var(--lens-hair);font-size:13px;line-height:1.55;color:var(--lens-ink)}
.lens-empty{font-size:13px;color:var(--lens-muted);line-height:1.5}
.lens-sheet .sheet{background:var(--navy);color:var(--lens-ink);padding:0}
.lens-sheet .grab{background:var(--navy3);margin:10px auto 0}

/* ---------- demo controls ---------- */
.demo-btn{position:fixed;left:20px;bottom:20px;z-index:80;height:40px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow-2);
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.demo{position:fixed;left:20px;bottom:72px;z-index:80;width:300px;background:var(--surface);border:1px solid var(--hair);border-radius:20px;box-shadow:0 20px 50px rgba(14,16,48,.18);padding:18px;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:all .22s var(--ease)}
.demo.open{opacity:1;transform:none;pointer-events:auto}
.demo h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:600}
.demo h4:first-child{margin-top:0}
.demo .chips .chip{min-height:36px;font-size:13px;padding:0 12px}
.toggle{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:40px;font-size:14px;text-align:left}
.sw2{width:40px;height:24px;border-radius:999px;background:var(--hair);position:relative;transition:background .2s;flex:none}
.sw2::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.toggle.on .sw2{background:var(--primary)}
.toggle.on .sw2::after{transform:translateX(16px)}

/* ---------- mobile ---------- */
@media (max-width: 980px){
  .stage{padding:0;gap:0;display:block;background:var(--bg)}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .phone::before{display:none}
  .app{border-radius:0}
  .topbar{margin-top:env(safe-area-inset-top, 0px)}
  .lens{display:none}
  .lens-pill{display:inline-flex}
  .wordmark{justify-self:start;margin-left:2px}
  .topbar.home .wordmark{margin-left:-46px}
  .demo-btn{display:none}
  .demo{left:12px;right:12px;width:auto;bottom:12px}
  .cta-bar{padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px))}
}
@media (max-width: 360px){
  .screen{padding-left:18px;padding-right:18px}
  h1.h{font-size:25px}
  .persona-grid{gap:10px}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>

const P = () => DATA.personas[S.persona] || DATA.personas.shop;
const isNewBiz = () => S.edge.newBiz || S.answers.tenure === "Less than 1 year";
const isCash = () => S.edge.cash || S.answers.pay === "Mostly cash";
function offer() {
  const p = P();
  let max, low = null, label, kind = "full";
  if (isNewBiz()) { max = DATA.starterPool; kind = "starter"; label = "Starter pool"; }
  else if (S.trail === "rough") {
    const e = S.roughEarn != null ? DATA.rough.earn[S.roughEarn].v : p.avg;
    max = r10k(Math.min(e * 1.6, p.pool * 1.15)); low = r10k(max * 0.6); label = "Rough estimate";
  } else if (isCash()) { max = r10k(p.pool * 0.4); low = r10k(max * 0.65); label = "Estimated from a thin trail"; kind = "thin"; }
  else { max = p.pool; label = "Based on your verified trail"; }
  let ask = S.edge.overAsk ? p.overAsk : (S.trail === "rough" && S.roughAsk != null ? DATA.rough.ask[S.roughAsk].v : null);
  return { max, low, label, kind, ask, over: ask && ask > max };
}
function drawAmt() {
  const o = offer(), p = P();
  const step = o.max <= 100000 ? 5000 : p.step;
  const def = o.kind === "starter" ? 25000 : (p.defaultDraw <= o.max * 0.8 ? p.defaultDraw : Math.round(o.max * 0.5 / step) * step);
  return clamp(S.draw == null ? def : S.draw, step, o.max);
}
const routeNow = () => S.route || P().route;
const rateNow = () => DATA.rates[S.route || (S.step === "pool" ? "bank" : routeNow())];
const confidence = () => S.trail === "bank" ? ["Bank-verified via AA (12 months)", "ok"] : S.trail === "pdf" ? ["Statement-verified (12 months)", "ok"] : S.trail === "rough" ? ["Self-declared (rough)", "warn"] : ["Self-declared", "warn"];
const stepIndex = () => ({ landing: -1, persona: 0, q: 1, trail: 2, loader: 2, mirror: 2, pool: 3, route: 3, lock: 4, done: 5 })[S.step];

function score() {
  const sig = [
    ["Persona picked", S.persona ? 15 : 0],
    ["Questions answered", Object.keys(S.answers).length * 5],
    ["Money trail shared", S.trail === "bank" ? 25 : S.trail === "pdf" ? 20 : S.trail === "rough" ? 6 : 0],
    ["Mirror confirmed", S.mirror === "ok" ? 10 : S.mirror === "off" ? 6 : 0],
    ["Payout route chosen", S.route ? 5 : 0],
    ["Phone verified", S.phoneVerified ? 15 : 0],
    ["Contact preference", S.contact == null ? 0 : S.contact === 2 ? 2 : 6],
    ["Offer saved", S.saved ? 4 : 0],
  ];
  let total = 5 + sig.reduce((a, s) => a + s[1], 0);
  if (S.persona && isNewBiz()) total -= 12;
  if (S.persona && isCash()) total -= 8;
  if (S.step === "landing" && !S.persona) total = 0;
  return { total: clamp(total, 0, 100), sig };
}

    const step2d = c === 2 ? "Come back with your saved link — nobody calls you" : c === 0 ? "Riya from Kestrel Finance messages you to confirm 2 details" : "Riya from Kestrel Finance confirms 2 details (10 min)";

  done() {

    const contact = S.contact === 1 ? `Call · ${DATA.lock.slots[S.slot]}` : DATA.lock.contact[S.contact];
    return {
      body: `

      <p class="sub">Your offer is held until <b style="color:var(--ink)">${until}</b>. Nothing is signed, and nothing moves without you.</p>

          <div style="margin-top:20px" class="lbl">Up to</div><div class="amt num">${inr(o.max)}</div>
          <div class="row"><div><div class="k">Pool holder</div><div class="v">${esc(S.name.toUpperCase() || p.who.toUpperCase())}</div></div><div style="text-align:right"><div class="k">Rate</div><div class="v">${DATA.rates[r]}% p.a.</div></div></div>
        </div>

      <div class="card pad rows" style="margin-top:16px">
        <div class="r"><span>Your work</span><b>${p.label}</b></div>

        <div class="r"><span>Money goes to</span><b>${r === "supplier" ? (S.persona === "clinic" ? "Equipment vendor" : "Your supplier") : "Your bank account"}</b></div>
        <div class="r"><span>We'll reach you</span><b>${contact}</b></div>
      </div>
      <div class="stack" style="margin-top:16px;gap:8px">
        <button class="btn btn-secondary" data-act="shareCA">${I.share}Share with my CA</button>
        <button class="btn btn-ghost" data-act="reset">Start over</button>
      </div>
      ${foot()}`,
      cta: "",
    };
  },
};

/* ---------- Lender Lens ---------- */
function lensHTML() {
  const sc = score(), t = sc.total;
  const lab = t >= 70 ? "Sales-ready" : t >= 35 ? "Warm" : "Cold";
  const col = t >= 70 ? "#5BE3A8" : t >= 35 ? "#FFC45E" : "#99A7FF";
  const C = 2 * Math.PI * 36;
  const [conf, ck] = confidence();
  if (!S.persona) {
    return `<div class="lens-sec"><div class="lens-k">Lead quality</div><div class="score"><div class="score-ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="#1C2156" stroke-width="7"/></svg><span class="n">0</span></div><div><div class="lab">Waiting for a visitor</div><div class="hint">This panel shows what Kestrel Finance sees, live, as the borrower moves through Breadcrumb.</div></div></div></div>
      <div class="lens-sec"><div class="lens-k">What we capture</div><p class="lens-empty">Nothing yet. No phone number, no name, no bureau pull — until the borrower chooses to share.</p></div>`;
  }
  const p = P(), o = offer(), d = drawAmt(), r = S.route || (stepIndex() >= 3 ? routeNow() : null);
  const fee = d * DATA.fees[r || "bank"] / 100, mi = d * DATA.rates[r || "bank"] / 100 / 12;
  const notes = [];
  if (r === "supplier") notes.push(["#5BE3A8", "Vendor-pay selected: funds can't be diverted"]);
  if (S.trail && S.trail !== "rough" && !isNewBiz()) notes.push(["#FFC45E", p.seasonal]);
  if (isCash()) notes.push(["#FFC45E", "Cash-heavy: verified inflow understates business — request GST / 2nd account"]);
  if (isNewBiz()) notes.push(["#99A7FF", "Under 1 year: starter limit, nurture track (6-month re-score)"]);
  if (o.over) notes.push(["#99A7FF", `Ask exceeds eligibility by ${inr(o.ask - o.max)} — upsell path via GST / vendor quote`]);
  if (S.mirror === "off") notes.push(["#FF8A7A", `User flagged mirror data${S.offNote ? `: “${esc(S.offNote.slice(0, 70))}”` : ""} — manual check before KFS`]);
  if (S.trail === "rough") notes.push(["#FFC45E", "Self-declared only — verify before sanction"]);
  if (S.answers.gst && S.answers.gst !== "Yes") notes.push(["#99A7FF", "No GST — limit capped; GST would lift pool to ₹5.2L"]);
  const showHandoff = stepIndex() >= 4;
  const name = S.name.trim() || p.who;
  return `
    <div class="lens-sec"><div class="lens-k">Lead quality</div>
      <div class="score"><div class="score-ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="#1C2156" stroke-width="7"/><circle cx="42" cy="42" r="36" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - t / 100)}"/></svg><span class="n">${t}</span></div>
        <div><div class="lab" style="color:${col}">${lab}</div><div class="hint">${lab === "Sales-ready" ? "Verified cash flow + reachable. Route to sales." : lab === "Warm" ? "Engaged. Needs trail or verification." : "Early signal only."}</div></div></div>
      <div class="signals">${sc.sig.map(s => `<div class="sig ${s[1] ? "on" : ""}"><span>${s[0]}</span><span class="p">${s[1] ? "+" + s[1] : "—"}</span></div>`).join("")}</div>
    </div>
    <div class="lens-sec"><div class="lens-k">Data confidence</div><div class="conf"><span class="pill ${ck}">${conf}</span></div>
      ${S.trail && S.trail !== "rough" ? `<div class="kv" style="margin-top:12px"><span>Verified avg inflow</span><b class="num">${inr(p.avg * (isCash() ? .45 : 1))}/mo</b><span>Months of trail</span><b>12</b></div>` : ""}</div>
    <div class="lens-sec"><div class="lens-k">Persona &amp; suggested product</div><div class="lens-v"><b style="font-weight:600">${p.label}</b> → ${isNewBiz() ? "Starter line, nurture track" : p.product}</div>
      ${Object.keys(S.answers).length ? `<div class="kv" style="margin-top:12px">${p.questions.filter(q => S.answers[q.id]).map(q => `<span>${q.q.replace(/\?$/, "").replace("…", "").slice(0, 34)}</span><b style="font-family:Inter">${S.answers[q.id]}</b>`).join("")}</div>` : ""}</div>
    <div class="lens-sec"><div class="lens-k">Risk notes</div>${notes.length ? `<div class="notes">${notes.map(n => `<div class="note"><i style="background:${n[0]}"></i><span>${n[1]}</span></div>`).join("")}</div>` : `<p class="lens-empty">No flags yet.</p>`}</div>
    ${stepIndex() >= 3 ? `<div class="lens-sec"><div class="lens-k">Revenue view <span style="text-transform:none;letter-spacing:0;font-weight:400">· illustrative</span></div>
      <div class="kv"><span>Pool approved</span><b>${inr(o.max)}</b><span>Drawn today</span><b>${inr(d)}</b><span>Setup fee earned (${DATA.fees[r || "bank"]}%)</span><b class="hl">${inr(fee)}</b><span>Expected interest / month</span><b class="hl">${inr(mi)}</b><span>Rate</span><b>${DATA.rates[r || "bank"]}% p.a.</b></div>
      <div class="capbar"><i style="width:${d / o.max * 100}%"></i></div>
      <p style="font-size:12.5px;color:var(--lens-muted);margin-top:8px">Capital committed today: <span class="lens-mono" style="color:var(--lens-ink)">${inr(d)}</span> (not ${inr(o.max)})</p></div>` : ""}
    ${showHandoff ? `<div class="lens-sec"><div class="lens-k">Sales handoff ${S.saved ? `<span style="color:#5BE3A8;text-transform:none;letter-spacing:0">· sent to queue</span>` : ""}</div>
      <div class="handoff"><div class="hd"><span class="nm">${esc(name)}</span><span class="tag" style="background:rgba(91,227,168,.12);color:#5BE3A8">${S.phoneVerified ? "Phone verified" : "Unverified"}</span></div>
        <div class="kv"><span>Persona</span><b style="font-family:Inter">${p.label}</b><span>Verified avg inflow</span><b>${S.trail === "rough" ? "—" : inr(p.avg * (isCash() ? .45 : 1))}</b><span>Pool</span><b>${inr(o.max)}</b><span>Route</span><b style="font-family:Inter">${routeNow() === "supplier" ? "Vendor / supplier pay" : "Bank transfer"}</b><span>Contact</span><b style="font-family:Inter">${S.contact == null ? "—" : S.contact === 1 ? "Call · " + (S.slot != null ? DATA.lock.slots[S.slot] : "slot pending") : S.contact === 2 ? "Do not call" : "WhatsApp"}</b>${S.phoneVerified ? `<span>Mobile</span><b>+91 ${S.phone.slice(0, 5)} ${S.phone.slice(5)}</b>` : ""}</div>
        <div class="sum"><span style="color:#99A7FF;font-size:11px;font-weight:600;letter-spacing:.06em;display:block;margin-bottom:4px">AI SUMMARY FOR CALLER</span>${esc(p.handoff.replace(p.who, name))}${S.mirror === "off" ? " Borrower flagged data — check note first." : ""}</div>
        <!-- LLM call goes here — one-line caller summary from the lead record -->
      </div></div>` : ""}`;
}

function demoHTML() {
  const e = S.edge;
  return `<h4>Persona shortcut</h4><div class="chips">${Object.entries(DATA.personas).map(([k, p]) => `<button class="chip ${S.persona === k ? "sel" : ""}" data-act="demoP:${k}">${p.short}</button>`).join("")}</div>
    <h4>Edge states</h4>
    <button class="toggle ${e.newBiz ? "on" : ""}" data-act="edge:newBiz">New business (&lt;1 year)<span class="sw2"></span></button>
    <button class="toggle ${e.cash ? "on" : ""}" data-act="edge:cash">Mostly cash / thin trail<span class="sw2"></span></button>
    <button class="toggle ${e.overAsk ? "on" : ""}" data-act="edge:overAsk">Asked for more than eligible<span class="sw2"></span></button>
    <p style="font-size:12px;color:var(--muted);margin-top:6px">“Something's off” lives on the mirror screen.</p>
    <h4>Jump to</h4><div class="chips">${[["persona", "Who"], ["trail", "Trail"], ["mirror", "Mirror"], ["pool", "Pool"], ["lock", "Lock"]].map(([s, l]) => `<button class="chip" data-act="jump:${s}">${l}</button>`).join("")}</div>
    <div style="height:14px"></div><button class="btn btn-secondary" style="height:44px;font-size:14px" data-act="reset">Reset demo</button>`;
}

/* ---------- progress ---------- */
function progressHTML() {
  const idx = stepIndex();
  if (idx < 0) return "";
  const w = Math.min(idx, 4) / 4 * 100;
  return `<div class="prog-row"><div class="prog-line"></div><div class="prog-fill" style="width:calc((100% - 12px) * ${w / 100})"></div>
    ${DATA.steps.map((s, i) => `<span class="prog-dot ${i < idx ? "done" : i === idx ? "now" : ""}"></span>`).join("")}</div>
    <div class="prog-labels">${DATA.steps.map((s, i) => `<span class="${i <= idx ? "on" : ""}">${s}</span>`).join("")}</div>`;
}

/* ---------- main render ---------- */
let lastStepKey = null;
function render() {
  const token = ++renderToken;
  const key = S.step + (S.step === "q" ? S.qi : "");
  const scr = Screens[S.step]();
  const scroll = $("#scroll");
  const isNew = key !== lastStepKey;
  const prevTop = scroll.scrollTop;
  scroll.innerHTML = `<div class="screen ${isNew ? (S.dir > 0 ? "enter" : "enter-back") : ""}">${scr.body}</div>`;
  if (isNew) scroll.scrollTop = 0; else scroll.scrollTop = prevTop;
  lastStepKey = key;
  $("#cta").innerHTML = scr.cta;
  const pr = $("#progress"); pr.innerHTML = progressHTML(); pr.classList.toggle("hide", S.step === "landing");
  const back = $("#backBtn"); back.disabled = S.step === "landing" || S.step === "loader" || S.step === "done"; $(".topbar").classList.toggle("home", S.step === "landing" || S.step === "done");
  renderSheet();
  renderLens();
  $("#demo").innerHTML = demoHTML();
  bindInputs();
  runTypers(token);
  runCounts();
  if (S.step === "loader") runLoader(token);
}
function renderSheet() {
  const layer = $("#sheetLayer");
  if (S.sheet) { $("#sheet").innerHTML = `<div class="grab"></div><button class="iconbtn sheet-close" data-act="closeSheet" aria-label="Close">${I.close}</button>${Sheets[S.sheet]()}`; requestAnimationFrame(() => layer.classList.add("open")); }
  else layer.classList.remove("open");
}
function renderLens() { const h = lensHTML(); $("#lensBody").innerHTML = h; $("#lensBodyM").innerHTML = h; }

/* ---------- typewriter (simulated streaming) ---------- */
function runTypers(token) {
  document.querySelectorAll("[data-type]").forEach(el => {
    const key = el.dataset.type, full = el.dataset.full, txt = plain(full);
    if (typed[key] >= txt.length) { el.innerHTML = md(full); return; }
    let i = typed[key] || 0; el.classList.add("typing");
    const tick = () => {
      if (token !== renderToken) return;
      i = Math.min(txt.length, i + 2); typed[key] = i;
      el.textContent = txt.slice(0, i);
      if (i < txt.length) setTimeout(tick, 16); else { el.classList.remove("typing"); el.innerHTML = md(full); }
    };
    setTimeout(tick, i ? 0 : 450);
  });
}
function runCounts() {
  document.querySelectorAll("[data-count]").forEach(el => {
    const key = el.dataset.count, to = +el.dataset.to;
    if (counted[key]) { el.textContent = inr(to); return; }
    counted[key] = true;
    const t0 = performance.now(), dur = 1000;
    const f = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = inr(k < 1 ? Math.round(to * e / 1000) * 1000 : to); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}
function runLoader(token) {
  const spans = [...document.querySelectorAll("#status span")]; let i = 0;
  const iv = setInterval(() => {
    if (token !== renderToken) return clearInterval(iv);
    i++; if (i < spans.length) spans.forEach((s, j) => s.classList.toggle("on", j === i));
  }, 1050);
  setTimeout(() => { clearInterval(iv); if (token !== renderToken) return; go(S.trail === "rough" ? "pool" : "mirror", { noHist: true }); }, 3300);
}

/* ---------- inputs that must not re-render on every keystroke ---------- */
function lockReady() { return S.name.trim().length > 1 && S.phoneVerified && S.contact != null && (S.contact !== 1 || S.slot != null); }
function bindInputs() {
  const ft = $("#freeText"); if (ft) { ft.oninput = e => S.freeText = e.target.value; ft.onkeydown = e => { if (e.key === "Enter") act("classify"); }; }
  const nm = $("#nm"); if (nm) nm.oninput = e => { S.name = e.target.value; $("#saveBtn").disabled = !lockReady(); renderLens(); };
  const ph = $("#ph"); if (ph) ph.oninput = e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10); S.phone = e.target.value; const b = $("#sendOtp"); if (b) b.disabled = S.phone.length !== 10; };
  const otp = $("#otp"); if (otp) otp.oninput = e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); S.otp = e.target.value; if (S.otp.length === 6) { S.phoneVerified = true; render(); toast("Number verified"); } };
  const aa = $("#aaOtp"); if (aa) aa.oninput = e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); S.otpConsent = e.target.value; $("#shareBtn").disabled = S.otpConsent.length !== 6; };
  const on = $("#offNote"); if (on) on.oninput = e => S.offNote = e.target.value;
  const rg = $("#drawR"); if (rg) rg.oninput = e => { S.draw = +e.target.value; updatePool(); };
}
function updatePool() {
  const o = offer(), d = drawAmt(), rate = DATA.rates.bank, rg = $("#drawR");
  const pct = d / o.max * 100, min = +rg.min;
  rg.style.setProperty("--pct", ((d - min) / (o.max - min) * 100) + "%");
  $("#drawV").textContent = inr(d); $("#sDraw").textContent = inr(d); $("#sFree").textContent = inr(o.max - d);
  $("#sInt").textContent = `about ${inr(Math.round(d * rate / 100 / 12 / 10) * 10)}/month interest at ${rate}% p.a.`;
  const f = $("#poolFill"); f.style.width = pct + "%"; f.classList.toggle("full", pct >= 99.9);
  $("#poolFillT").textContent = pct > 28 ? "In use" : ""; $("#poolFree").textContent = pct < 72 ? "₹0 interest" : "";
  renderLens();
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) { const t = $("#toast"); t.innerHTML = `${I.check("#5BE3A8", 15)}<span>${msg}</span>`; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }

/* =========================================================
   Actions
   ========================================================= */
function go(step, opts = {}) {
  if (!opts.noHist) S.hist.push({ step: S.step, qi: S.qi });
  S.dir = 1; S.step = step; if (opts.qi != null) S.qi = opts.qi; S.sheet = null; render();
}
function back() {
  if (S.sheet) { S.sheet = null; return render(); }
  let h = S.hist.pop();
  while (h && h.step === "loader") h = S.hist.pop();
  if (!h) return;
  S.dir = -1; S.step = h.step; S.qi = h.qi; render();
}
function classify(text) {
  // LLM call goes here — classify the free-text business description into a persona
  const t = text.trim(); if (!t) return null;
  const hit = DATA.classify.find(c => c.re.test(t));
  const id = hit ? hit.p : "local";
  const desc = t.replace(/^(i\s+(run|own|have|am|do)\s+(a|an)?\s*|i'?m\s+(a|an)\s+)/i, "").replace(/[.!]+$/, "");
  const line = hit ? `Sounds like **${DATA.personas[id].label}** — ${/^(a|an|the)\s/i.test(desc) ? "" : "a "}${desc.toLowerCase()}. Got it.` : `Closest fit looks like **${DATA.personas[id].label}**. You can pick another above if it isn't right.`;
  return { id, line: line, key: Date.now() };
}
function act(a, el) {
  const [cmd, ...args] = a.split(":"); const arg = args.join(":");
  switch (cmd) {
    case "start": return go("persona");
    case "back": return back();
    case "sheet": S.sheet = arg; if (arg === "consent") S.consentStage = "banks"; if (arg === "pdf") S.pdfStage = 0; return render();
    case "closeSheet": S.sheet = null; return render();
    case "persona": if (S.persona !== arg) { S.answers = {}; S.draw = null; S.route = null; } S.persona = arg; return render();
    case "classify": { const c = classify(S.freeText); if (!c) return; S.classified = { ...c, id: c.id + c.key }; if (S.persona !== c.id) { S.answers = {}; S.draw = null; S.route = null; } S.persona = c.id; render(); setTimeout(() => document.querySelector('#scroll .ai')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60); return; }
    case "toQuestions": return go("q", { qi: 0 });
    case "answer": {
      const [qid, ...rest] = args; S.answers[qid] = rest.join(":").replace(/&amp;/g, "&");
      render();
      setTimeout(() => { if (S.qi < P().questions.length - 1) go("q", { qi: S.qi + 1 }); else go("trail"); }, 260);
      return;
    }
    case "trailOpt": S.sheet = arg === "bank" ? "consent" : arg; if (arg === "bank") { S.consentStage = "banks"; } if (arg === "pdf") S.pdfStage = 0; return render();
    case "bank": S.bank = +arg; return render();
    case "consentNext": S.consentStage = "otp"; render(); setTimeout(() => $("#aaOtp")?.focus(), 350); return;
    case "consentBack": S.consentStage = "banks"; return render();
    case "shareOnce": S.trail = "bank"; S.mirror = null; S.sheet = null; return go("loader");
    case "pickPdf": S.pdfStage = 1; render(); setTimeout(() => { const b = $("#pdfBar"); if (b) b.style.width = "100%"; }, 50); setTimeout(() => { if (S.sheet === "pdf") { S.pdfStage = 2; render(); } }, 1300); return;
    case "pdfGo": S.trail = "pdf"; S.mirror = null; return go("loader");
    case "rEarn": S.roughEarn = +arg; return render();
    case "rAsk": S.roughAsk = +arg; return render();
    case "roughGo": S.trail = "rough"; S.mirror = null; S.draw = null; return go("loader");
    case "mirrorOk": S.mirror = "ok"; return go("pool");
    case "offGo": S.mirror = "off"; S.sheet = null; return go("pool");
    case "lever": toast("Saved — you can add this after saving your offer"); return;
    case "toRoute": return go("route");
    case "route": S.route = arg; return render();
    case "quoteLater": toast("Noted — add the quote any time before we pay"); return;
    case "toLock": if (!S.route) S.route = routeNow(); return go("lock");
    case "sendOtp": S.otpSent = true; render(); toast("Code sent to +91 " + S.phone.slice(0, 5) + " " + S.phone.slice(5)); setTimeout(() => $("#otp")?.focus(), 50); return;
    case "contact": S.contact = +arg; if (S.contact !== 1) S.slot = null; return render();
    case "slot": S.slot = +arg; return render();
    case "save": if (!lockReady()) return; S.saved = true; return go("done");
    case "shareCA": toast("Link copied — it shows your summary only, and expires in 7 days"); return;
    case "reset": Object.keys(typed).forEach(k => delete typed[k]); Object.keys(counted).forEach(k => delete counted[k]); S = fresh(); lastStepKey = null; $("#demo").classList.remove("open"); closeLens(); return render();
    case "openLens": $("#lensSheet").classList.add("open"); return;
    case "closeLens": return closeLens();
    case "toggleDemo": $("#demo").classList.toggle("open"); return;
    case "openDemo": closeLens(); $("#demo").classList.add("open"); return;
    case "edge": S.edge[arg] = !S.edge[arg]; S.draw = null; if (!S.persona) S.persona = "shop"; return render();
    case "demoP": S.persona = arg; S.answers = {}; S.draw = null; S.route = null; S.trail = S.trail || "bank"; S.hist = [{ step: "landing", qi: 0 }, { step: "persona", qi: 0 }, { step: "trail", qi: 0 }]; S.dir = 1; S.step = "mirror"; S.mirror = null; return render();
    case "jump": {
      if (!S.persona) S.persona = "shop";
      if (["mirror", "pool", "lock"].includes(arg) && !S.trail) S.trail = "bank";
      if (arg === "lock" && !S.route) S.route = routeNow();
      S.sheet = null; return go(arg);
    }
  }
}
function closeLens() { $("#lensSheet").classList.remove("open"); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (!a.startsWith("toggleDemo") && !el.closest("#demo") && !a.startsWith("openDemo")) $("#demo").classList.remove("open");
  act(a, el);
});
document.addEventListener("click", e => { if (!e.target.closest("#demo") && !e.target.closest("[data-act]")) $("#demo").classList.remove("open"); }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (S.sheet) act("closeSheet"); closeLens(); $("#demo").classList.remove("open"); } });

render();
</script>
</body>
</html>
